[package]
name = "unifont-cli"
description = "Command-line font manager: scan, search, inspect and export fonts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "unifont"
path = "src/main.rs"

[dependencies]
unifont-core.workspace = true
unifont-platform.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "std", "layout-cache"] }
