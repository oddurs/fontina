[package]
name = "unifont-cli"
description = "Command-line font manager: scan, search, inspect and export fonts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "unifont"
path = "src/main.rs"

[dependencies]
unifont-core.workspace = true
unifont-platform.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "std", "layout-cache"] }
clap_complete = "4"
clap_mangen = "0.3"

# `cargo deb` and `cargo generate-rpm` (run in the release workflow after
# `unifont completions` and `unifont man --out-dir` have filled target/pkg/).
[package.metadata.deb]
name = "unifont"
section = "utils"
priority = "optional"
extended-description = "A lightweight, terminal-first font manager. Indexes fonts into a searchable SQLite database, previews them with real shaping in the terminal, activates and installs them per user, and organises them with tags and collections. No network, no telemetry."
assets = [
  ["target/release/unifont", "usr/bin/", "755"],
  ["../../README.md", "usr/share/doc/unifont/README.md", "644"],
  ["../../target/pkg/completions/unifont.bash", "usr/share/bash-completion/completions/unifont", "644"],
  ["../../target/pkg/completions/_unifont", "usr/share/zsh/vendor-completions/_unifont", "644"],
  ["../../target/pkg/completions/unifont.fish", "usr/share/fish/vendor_completions.d/unifont.fish", "644"],
  ["../../target/pkg/man/*.1", "usr/share/man/man1/", "644"],
]

[package.metadata.generate-rpm]
name = "unifont"
summary = "Lightweight, terminal-first font manager"
license = "MIT OR Apache-2.0"
assets = [
  { source = "target/release/unifont", dest = "/usr/bin/unifont", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/unifont/README.md", mode = "644", doc = true },
  { source = "target/pkg/completions/unifont.bash", dest = "/usr/share/bash-completion/completions/unifont", mode = "644" },
  { source = "target/pkg/completions/_unifont", dest = "/usr/share/zsh/site-functions/_unifont", mode = "644" },
  { source = "target/pkg/completions/unifont.fish", dest = "/usr/share/fish/vendor_completions.d/unifont.fish", mode = "644" },
  { source = "target/pkg/man/*.1", dest = "/usr/share/man/man1/", mode = "644", doc = true },
]
