[package]
name = "fontina-cli"
description = "Command-line font manager: scan, search, inspect and export fonts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "fontina"
path = "src/main.rs"

# musl's allocator serialises threaded allocation and a scan is rayon-parallel: indexing
# ten thousand files takes 5.7 s with it and 1.3 s without, against 1.3 s on glibc.
# Measured by scripts/bench; the glibc builds keep their own allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dependencies]
fontina-core.workspace = true
fontina-platform.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# The CLI prints types of its own with --json (the agent reports, the licence table, the
# restore report); each has to be described in `schemas/cli-output.json` like the core's.
schemars.workspace = true
anyhow.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "std", "layout-cache"] }
clap_complete = "4"
clap_mangen = "0.3"

# Tests only. `rusqlite` is a crate the workspace already builds: `restore` has to be
# exercised against an index whose writes fail, and nothing in the core's public API
# can break an index on purpose; `insta` snapshots the frames the browser draws into
# ratatui's in-memory test backend, the way fontina-core snapshots parsed metadata.
#
# `jsonschema` is what makes "`--json` output validates against `schemas/cli-output.json`"
# a test rather than a sentence (tests/schema_conformance.rs). It is the maintained Rust
# implementation of draft 2020-12, which is the draft `schemars` emits, and it is MIT, so
# `deny.toml` already allows it. `default-features = false` turns off the HTTP and file
# retrievers: a validator that could fetch a remote `$ref` would be a network call, and
# the schemas are local files with no external references. Dev-only, so nothing here
# reaches the shipped binary — `cargo tree -e normal -p fontina-cli` has no jsonschema.
[dev-dependencies]
rusqlite.workspace = true
insta.workspace = true
jsonschema = { version = "0.53", default-features = false }

# `cargo deb` and `cargo generate-rpm` (run in the release workflow after
# `fontina completions` and `fontina man --out-dir` have filled target/pkg/).
[package.metadata.deb]
name = "fontina"
# Debian Policy 5.6.2: mandatory, and dpkg-deb warns on every read without it. The
# address is the one SECURITY.md already publishes for reports.
maintainer = "Oddur Sigurdsson <oddurs@gmail.com>"
section = "utils"
priority = "optional"
extended-description = "A lightweight, terminal-first font manager. Indexes fonts into a searchable SQLite database, previews them with real shaping in the terminal, activates and installs them per user, and organises them with tags and collections. No network, no telemetry."
# Debian Policy 12.5: a package carries its licence at /usr/share/doc/<pkg>/copyright.
# Without this, cargo-deb writes a four-line stub that names GPL-3.0-or-later and ships
# none of it, which is not what the GPL asks of anyone conveying a binary.
# scripts/test-packages asserts the text is there.
license-file = ["../../COPYING", "0"]
assets = [
  ["target/release/fontina", "usr/bin/", "755"],
  ["../../README.md", "usr/share/doc/fontina/README.md", "644"],
  ["../../target/pkg/completions/fontina.bash", "usr/share/bash-completion/completions/fontina", "644"],
  ["../../target/pkg/completions/_fontina", "usr/share/zsh/vendor-completions/_fontina", "644"],
  ["../../target/pkg/completions/fontina.fish", "usr/share/fish/vendor_completions.d/fontina.fish", "644"],
  ["../../target/pkg/man/*.1", "usr/share/man/man1/", "644"],
]

[package.metadata.generate-rpm]
name = "fontina"
summary = "Lightweight, terminal-first font manager"
license = "GPL-3.0-or-later"
assets = [
  { source = "target/release/fontina", dest = "/usr/bin/fontina", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/fontina/README.md", mode = "644", doc = true },
  # Fedora keeps a package's licence in /usr/share/licenses/<pkg>; nothing put it there
  # before, so the .rpm conveyed a GPL binary with no licence text at all. Deliberately
  # not marked `doc`: a licence has to survive an install with tsflags=nodocs, which is
  # how every container image installs. (cargo-generate-rpm cannot set rpm's %license
  # file flag, so `rpm -qL` stays empty until it grows a way to.)
  { source = "COPYING", dest = "/usr/share/licenses/fontina/COPYING", mode = "644" },
  { source = "target/pkg/completions/fontina.bash", dest = "/usr/share/bash-completion/completions/fontina", mode = "644" },
  { source = "target/pkg/completions/_fontina", dest = "/usr/share/zsh/site-functions/_fontina", mode = "644" },
  { source = "target/pkg/completions/fontina.fish", dest = "/usr/share/fish/vendor_completions.d/fontina.fish", mode = "644" },
  { source = "target/pkg/man/*.1", dest = "/usr/share/man/man1/", mode = "644", doc = true },
]
