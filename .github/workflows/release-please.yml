name: release-please

on:
  push:
    branches: [main]
  # Backstop: a merge performed on behalf of GITHUB_TOKEN (auto-merge enabled by the
  # automerge workflow) does not trigger push workflows.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

env:
  RELEASE_BRANCH: release-please--branches--main

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps Cargo.toml but cannot rewrite the workspace entries in
      # Cargo.lock, and a PR it opens with GITHUB_TOKEN gets no CI. Both are fixed on
      # the release branch whenever one exists: sync the lockfile, then dispatch CI so
      # the required checks exist and the PR can merge into protected main.
      - name: Is there a release branch?
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.rel.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0
      - if: steps.rel.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.rel.outputs.exists == 'true'
        name: Sync Cargo.lock and make sure CI has run on the release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pushed=false
          cargo update --workspace
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): sync Cargo.lock with the workspace version"
            git push origin "HEAD:$RELEASE_BRANCH"
            pushed=true
          fi
          sha=$(git rev-parse HEAD)
          checks=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --jq '.total_count')
          if [ "$pushed" = true ] || [ "$checks" = "0" ]; then
            gh workflow run ci.yml --ref "$RELEASE_BRANCH"
          fi
