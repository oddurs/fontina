name: release-please

on:
  push:
    branches: [main]
  # Merges made by the automerge workflow use GITHUB_TOKEN, whose pushes do not
  # trigger push workflows; the automerge job dispatches this one explicitly.
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: rust
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
