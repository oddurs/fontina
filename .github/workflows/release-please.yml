name: release-please

on:
  push:
    branches: [main]
  # Backstop: a merge performed on behalf of GITHUB_TOKEN (auto-merge enabled by the
  # automerge workflow) does not trigger push workflows.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  RELEASE_BRANCH: release-please--branches--main

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # A release created with the workflow token fires no `release` event, so the
      # build that attaches binaries, checksums, provenance and the SBOM must be
      # dispatched by hand. workflow_dispatch is the one event that token may raise.
      - if: steps.rp.outputs.release_created == 'true'
        name: Build the release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --repo, because nothing is checked out at this point in the job and `gh`
        # otherwise looks for a git remote and fails with "not a git repository".
        run: |
          gh workflow run release.yml --repo "${{ github.repository }}" \
            --ref main -f tag="${{ steps.rp.outputs.tag_name }}"

      # release-please bumps Cargo.toml but cannot rewrite the workspace entries in
      # Cargo.lock, and the CI runs GitHub creates for a bot-authored PR wait for
      # approval. Whenever a release branch exists: sync the lockfile, then approve the
      # pending pull_request CI runs so the required checks attach to the release PR.
      - name: Is there a release branch?
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.rel.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0
      - if: steps.rel.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.rel.outputs.exists == 'true'
        name: Sync Cargo.lock and approve CI on the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cargo update --workspace
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): sync Cargo.lock with the workspace version"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi
          sha=$(git rev-parse HEAD)
          # Every workflow, not only ci.yml: linux, perf and fuzz are held the same way
          # on a bot-authored pull request, and a release branch that never runs them is
          # a release nobody measured. The pull_request runs take a moment to appear.
          for attempt in $(seq 1 12); do
            ids=$(gh run list --branch "$RELEASE_BRANCH" --event pull_request \
              --json databaseId,headSha,conclusion \
              --jq ".[] | select(.headSha==\"$sha\" and .conclusion==\"action_required\") | .databaseId")
            if [ -n "$ids" ]; then
              for id in $ids; do
                gh api -X POST "repos/$REPO/actions/runs/$id/approve" >/dev/null && echo "approved CI run $id"
              done
              break
            fi
            sleep 10
          done
