name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # platform-tests register a fixture font with the OS (session scope, per-user) and
      # undo it; the runner is disposable.
      #
      # nextest rather than `cargo test` for one reason that matters here: every test gets
      # a deadline, so a hang is a named failure after five minutes instead of a job that
      # sits until GitHub kills it at six hours with nothing to read. .config/nextest.toml
      # carries the rest, including why fontina-platform runs single-threaded — its tests
      # touch CoreText and the font registry, which no sandbox redirects, and one process
      # per test makes the in-process mutex that used to serialise them serialise nothing.
      - run: cargo nextest run --profile ci --workspace --features fontina-platform/platform-tests
      # nextest does not run doctests and does not pretend to, so they are run beside it.
      # There are none today. That is exactly why this step exists: without it the first
      # doctest anybody writes would never run and nothing would say so.
      - run: cargo test --workspace --doc
      - name: smoke the CLI
        shell: bash
        run: |
          cargo run -q -p fontina-cli -- --db "${RUNNER_TEMP}/u.db" scan fixtures
          cargo run -q -p fontina-cli -- --db "${RUNNER_TEMP}/u.db" list --json | head -c 400
          cargo run -q -p fontina-cli -- --db "${RUNNER_TEMP}/u.db" scan --system
          cargo run -q -p fontina-cli -- --db "${RUNNER_TEMP}/u.db" activate --session family:Amiri
          cargo run -q -p fontina-cli -- --db "${RUNNER_TEMP}/u.db" activations
          cargo run -q -p fontina-cli -- --db "${RUNNER_TEMP}/u.db" deactivate family:Amiri

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The MSRV is an input, not a tag, so Dependabot cannot "upgrade" it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    name: manual builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y texinfo
      # A manual that is never built is a manual that rots.
      - run: makeinfo --no-split -o /tmp/fontina.info docs/fontina.texi
      - run: makeinfo --html --no-split -o /tmp/fontina.html docs/fontina.texi

  weight:
    name: no large files added
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Three build artefacts have reached main by accident — site/node_modules (#14),
      # crates.real (#25), and two 6.5 MB binaries (#61) — each under a name nobody had
      # thought to ignore. .gitignore only stops the accident it can name; this stops the
      # shape. Fixtures are exempt: they are deliberately committed binaries, and capped
      # by their own rule in CONTRIBUTING.md.
      - name: refuse a large file that is not a fixture
        run: |
          base=$(git merge-base origin/${{ github.base_ref || 'main' }} HEAD)
          limit=$((1024 * 1024))
          fail=0
          while read -r path; do
            [ -n "$path" ] || continue
            case "$path" in fixtures/*|fuzz/regressions/*) continue ;; esac
            size=$(git cat-file -s "$(git rev-parse "HEAD:$path")" 2>/dev/null || echo 0)
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$path::$path is $((size / 1024)) KB. Committed build output is how site/node_modules, crates.real and two 6.5 MB binaries reached main. If it belongs in the repository, add it to the exemptions in .github/workflows/ci.yml and say why in the pull request."
              fail=1
            fi
          done < <(git diff --name-only --diff-filter=AM "$base" HEAD)
          exit $fail

  workflows:
    name: workflows are valid
    runs-on: ubuntu-latest
    # An invalid workflow file produces no run, and therefore no failing check: GitHub
    # reports "This run likely failed because of a workflow file issue" against the whole
    # file and stops before the first job. So the workflow that would report the problem
    # is the one that cannot start. #112 shipped `join(needs.*.result, " ")` — valid YAML,
    # ordinary-looking bash, and a syntax error in a language that has only single-quoted
    # strings — and took four workflows off main until somebody noticed they were quiet.
    #
    # This job is in ci.yml, which has no path filter and every pull request runs, so a
    # broken workflow file is caught by a workflow that still works.
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The floor is 85%, and the number on the day this was added was 92.42% lines,
      # 91.19% regions, 91.49% functions across 28,670 regions. The gap between the two
      # is deliberate.
      #
      # A floor set at today's number fails on the next pull request that adds an error
      # branch nothing exercises, which is most of them, and a check that fails for
      # something nobody did wrong is a check people learn to re-run until it passes. A
      # floor seven points down does not notice a wobble and does notice a collapse — a
      # test file deleted, a feature landing with nothing behind it, a suite quietly
      # stopping at the first failure.
      #
      # If this ever fails, the question is not "which line is uncovered" but "what
      # stopped running".
      - run: >
          cargo llvm-cov --workspace --features fontina-platform/platform-tests
          --fail-under-lines 85 --summary-only

  schema:
    name: schema is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          for s in face collection cli-output; do
            cargo run -q -p fontina-cli -- schema $s > /tmp/$s.json && diff -u schemas/$s.json /tmp/$s.json
          done
