# Builds release binaries when release-please publishes a GitHub release.
# Each archive gets a SHA-256 checksum and a SLSA build-provenance attestation;
# an SPDX SBOM for the whole workspace is attached alongside.

name: release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     target: x86_64-unknown-linux-gnu,  ext: tar.gz }
          - { os: ubuntu-24.04-arm,  target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest,      target: aarch64-apple-darwin,      ext: tar.gz }
          - { os: macos-latest,      target: x86_64-apple-darwin,       ext: tar.gz }
          - { os: windows-latest,    target: x86_64-pc-windows-msvc,    ext: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p unifont-cli --target ${{ matrix.target }}

      - name: Package
        id: pkg
        shell: bash
        run: |
          name="unifont-${{ github.event.release.tag_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin=unifont; [ "${{ runner.os }}" = "Windows" ] && bin=unifont.exe
          cp "target/${{ matrix.target }}/release/$bin" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          archive="$name.${{ matrix.ext }}"
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pkg.outputs.archive }}

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" ${{ steps.pkg.outputs.archive }} ${{ steps.pkg.outputs.archive }}.sha256 --clobber

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: unifont-${{ github.event.release.tag_name }}.spdx.json
          upload-artifact: false
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" unifont-${{ github.event.release.tag_name }}.spdx.json --clobber
