# Builds release binaries for a tagged release. Each archive gets a SHA-256 checksum
# and a SLSA build-provenance attestation; an SPDX SBOM for the whole workspace is
# attached alongside.
#
# release-please creates the GitHub release with the workflow token, and a release
# created that way does not fire `release` events, so the release-please workflow
# dispatches this one with the tag as input. The `release` trigger stays for releases
# made by hand. Either way the tag is checked out, so `--ref main` is fine.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build, e.g. v0.1.0 (the release must exist)
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl for GNU/Linux. A glibc build carries the version of whatever
          # runner built it: v0.1.0 needed GLIBC_2.39 and would not start on Debian 12,
          # Ubuntu 22.04 or RHEL 9. A static binary has no such floor.
          - { os: ubuntu-latest,     target: x86_64-unknown-linux-musl,  ext: tar.gz, musl: true }
          - { os: ubuntu-24.04-arm,  target: aarch64-unknown-linux-musl, ext: tar.gz, musl: true }
          - { os: macos-latest,      target: aarch64-apple-darwin,      ext: tar.gz }
          - { os: macos-latest,      target: x86_64-apple-darwin,       ext: tar.gz }
          - { os: windows-latest,    target: x86_64-pc-windows-msvc,    ext: zip }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # musl-gcc links the static binary, and builds mimalloc's C for the same target.
      - if: matrix.musl
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          # cc-rs reads CC_<target with underscores>; only the triple is rewritten.
          echo "CC_$(echo '${{ matrix.target }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p fontina-cli --target ${{ matrix.target }}

      # Completions and man pages come from the binary itself, so they always match it.
      # Cross-built binaries cannot run here; the host build generates them instead.
      - name: Generate completions and man pages
        shell: bash
        run: |
          cargo build --release --locked -p fontina-cli
          gen=target/release/fontina; [ "${{ runner.os }}" = "Windows" ] && gen=target/release/fontina.exe
          mkdir -p target/pkg/completions target/pkg/man
          "$gen" completions bash > target/pkg/completions/fontina.bash
          "$gen" completions zsh  > target/pkg/completions/_fontina
          "$gen" completions fish > target/pkg/completions/fontina.fish
          "$gen" completions powershell > target/pkg/completions/_fontina.ps1
          "$gen" man --out-dir target/pkg/man

      - name: Package
        id: pkg
        shell: bash
        run: |
          name="fontina-${{ env.TAG }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin=fontina; [ "${{ runner.os }}" = "Windows" ] && bin=fontina.exe
          cp "target/${{ matrix.target }}/release/$bin" README.md COPYING docs/fontina.texi "dist/$name/"
          cp -r target/pkg/completions target/pkg/man "dist/$name/"
          cd dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          archive="$name.${{ matrix.ext }}"
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.pkg.outputs.archive }}

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.TAG }}" ${{ steps.pkg.outputs.archive }} ${{ steps.pkg.outputs.archive }}.sha256 --clobber

      # Distro packages for Linux, from the same binary, with the completions and man
      # pages in their conventional places.
      - name: Build .deb and .rpm
        if: runner.os == 'Linux'
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          cargo deb --no-build --no-strip -p fontina-cli --target ${{ matrix.target }} -o dist/
          cargo generate-rpm -p crates/fontina-cli --target ${{ matrix.target }} -o dist/
          ls -la dist/*.deb dist/*.rpm
      - name: Upload the packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*.deb dist/*.rpm; do
            sha256sum "$f" > "$f.sha256"
            gh release upload "${{ env.TAG }}" "$f" "$f.sha256" --clobber
          done

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: fontina-${{ env.TAG }}.spdx.json
          upload-artifact: false
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.TAG }}" fontina-${{ env.TAG }}.spdx.json --clobber
