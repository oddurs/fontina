# Builds the web site in site/ and publishes it to GitHub Pages.
# Pull requests that touch the site only get the build; main also deploys.
name: site

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/adr/**', 'crates/fontina-cli/src/ui/snapshots/**', '.github/workflows/site.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether this workflow's subject was touched at all.
  #
  # The filter used to live on the trigger, and that is why the gate below did not work:
  # a pull request touching none of these paths made GitHub create no run, so the gate
  # never ran and reported nothing, and an unreported required check waits for ever
  # rather than passing. #207 changed one line of CLAUDE.md and got none of the five
  # gates. The gate's own comment described that failure and the fix did not reach it.
  #
  # `push` keeps its filter: a push to main that touches nothing here has nothing to
  # deploy, and no gate is required of it.
  changes:
    name: site changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          # Empty on push and workflow_dispatch, where everything is relevant.
          BASE: ${{ github.event.pull_request.base.sha }}
          PATTERN: '^site/|^docs/adr/|^crates/fontina-cli/src/ui/snapshots/|^\.github/workflows/site\.yml$'
        run: |
          if [ -z "$BASE" ]; then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
            echo "not a pull request: everything is relevant"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "changed:"
          printf '%s\n' "$changed" | sed 's/^/  /'
          if printf '%s\n' "$changed" | grep -qE "$PATTERN"; then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
          else
            echo "relevant=false" >>"$GITHUB_OUTPUT"
            echo "none of $PATTERN was touched; the jobs below will skip"
          fi

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # page footers show the last commit date of their source
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE: /${{ github.event.repository.name }}
      # The demos animate with CSS and nothing else, which means a step count that
      # disagrees with its string, a frame with no delay, or a class the reduced-motion
      # block forgets are all silent: the page builds, deploys and looks nearly right.
      - run: npm run check:demos
        working-directory: site
      # upload-pages-artifact drops every dot-directory, which loses .well-known/security.txt,
      # so the artifact is packed by hand. deploy-pages only needs it named github-pages.
      - run: tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" -C site/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The check branch protection can require. Everything above is path-filtered, so on a
  # pull request that touches none of those paths GitHub creates no run at all and reports
  # nothing — and an unreported required check is not a passing one, it is one that waits
  # for ever. #38 changed only PLAN.md and got exactly the eight checks already required.
  #
  # `if: always()` makes this report whatever the jobs above did, including nothing. A
  # skipped dependency is a pass, because the paths this workflow guards were untouched;
  # a failure or a cancellation is a failure. So a docs-only pull request goes green in
  # seconds without running an Astro build.
  #
  # `needs.*.result` covers every dependency listed below, so adding a job to `needs`
  # is enough — there is no second list to keep in step.
  gate:
    name: site
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job above either passed or did not need to run
        # Through the environment, not interpolated into the script. An expression
        # substituted into a `run:` body is spliced in as text before bash sees it, so
        # the shell's quoting cannot contain it; here bash reads an ordinary variable.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "dependencies: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a job this gate stands for reported $r"; exit 1 ;;
            esac
          done
