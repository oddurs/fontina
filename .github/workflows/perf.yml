# The budgets in PLAN.md §7 are a promise, and a promise nobody measures is a wish.
# scripts/bench builds a corpus of real font files, drives the release binary against it,
# and fails on a miss. Runners are shared and noisy, so each timing is the best of three:
# the best run is what the machine can do, the rest is whatever else it was doing.
#
# The browser's two budgets are measured one layer below the binary, through its own
# drawing code against an in-memory terminal, because the browser needs a terminal to be
# in. That is why this job needs the source tree and a toolchain rather than an artifact.
name: perf

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/bench'
      - '.github/workflows/perf.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  budgets:
    name: budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/bench

  # The check branch protection can require. Everything above is path-filtered, so on a
  # pull request that touches none of those paths GitHub creates no run at all and reports
  # nothing — and an unreported required check is not a passing one, it is one that waits
  # for ever. #38 changed only PLAN.md and got exactly the eight checks already required.
  #
  # `if: always()` makes this report whatever the jobs above did, including nothing. A
  # skipped dependency is a pass, because the paths this workflow guards were untouched;
  # a failure or a cancellation is a failure. So a docs-only pull request goes green in
  # seconds without running a ten-thousand-file benchmark.
  #
  # `needs.*.result` covers every dependency listed below, so adding a job to `needs`
  # is enough — there is no second list to keep in step.
  gate:
    name: perf
    needs: [budgets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job above either passed or did not need to run
        # Through the environment, not interpolated into the script. An expression
        # substituted into a `run:` body is spliced in as text before bash sees it, so
        # the shell's quoting cannot contain it; here bash reads an ordinary variable.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "dependencies: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a job this gate stands for reported $r"; exit 1 ;;
            esac
          done
