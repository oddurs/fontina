# Turns on GitHub's native auto-merge for Dependabot minor/patch updates and for any PR
# carrying the `automerge` label. Branch protection on main then merges the PR once the
# required checks pass. No polling, no custom merge logic.
#
# Humans and coding agents do not need this workflow: after opening a PR, run
#   gh pr merge --auto --squash --delete-branch
# and GitHub does the rest.

name: automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      github.event.pull_request.draft == false &&
      (github.actor == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'automerge'))
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        if: github.actor == 'dependabot[bot]'
        id: md
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: >-
          github.actor != 'dependabot[bot]' ||
          steps.md.outputs.update-type == 'version-update:semver-minor' ||
          steps.md.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
