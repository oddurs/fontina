# Merges a pull request once every other check on its head commit has succeeded.
#
# Applies to Dependabot minor/patch updates and to any PR carrying the `automerge`
# label (only collaborators can add labels). It never checks out PR code, so
# pull_request_target is safe here. It waits for the checks itself instead of relying
# on GitHub's auto-merge, which merges immediately when no branch protection
# requires checks.

name: automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: >-
      github.event.pull_request.draft == false &&
      (github.actor == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'automerge'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
    steps:
      - name: Dependabot metadata
        if: github.actor == 'dependabot[bot]'
        id: md
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide
        id: decide
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            case "${{ steps.md.outputs.update-type }}" in
              version-update:semver-minor|version-update:semver-patch) echo "go=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "major update: leaving for a human"; echo "go=false" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the other checks, then squash-merge
        if: steps.decide.outputs.go == 'true'
        run: |
          for i in $(seq 1 80); do
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name != "automerge") | {name, status, conclusion}]')
            total=$(jq length <<<"$runs")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            failed=$(jq '[.[] | select(.conclusion != null and (.conclusion | IN("success","skipped","neutral") | not))] | length' <<<"$runs")
            echo "checks: $total total, $pending pending, $failed failed"
            if [ "$failed" -gt 0 ]; then
              jq -r '.[] | select(.conclusion != null and (.conclusion | IN("success","skipped","neutral") | not)) | "  \(.name): \(.conclusion)"' <<<"$runs"
              exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              gh pr merge "$PR" --squash --delete-branch
              exit 0
            fi
            sleep 30
          done
          echo "timed out waiting for checks"; exit 1
