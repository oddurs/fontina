[workspace]
resolver = "2"
members = [
  "crates/unifont-core",
  "crates/unifont-platform",
  "crates/unifont-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oddurs/unifont"
homepage = "https://github.com/oddurs/unifont"
authors = ["Oddur Sigurdsson"]
readme = "README.md"
keywords = ["font", "opentype", "typography", "font-manager", "woff2"]
categories = ["command-line-utilities", "text-processing", "multimedia"]

[workspace.dependencies]
unifont-core = { path = "crates/unifont-core" }
unifont-platform = { path = "crates/unifont-platform" }

skrifa = "0.46"
read-fonts = "0.43"
woff2-patched = "0.4"
flate2 = "1"
blake3 = "1"
rayon = "1"
walkdir = "2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
anyhow = "1"
directories = "6"
unicode-script = "0.5"
unicode-blocks = "0.1"
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
insta = { version = "1", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
