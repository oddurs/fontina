# fontina is GPL-3.0-or-later (ADR 0007), so every dependency must be under a license
# the FSF lists as GPLv3-compatible. Permissive licenses stay allowed because permissive
# code can be combined into a GPL work; the reverse is what the project rules out.
# Anything GPL-incompatible — the original 4-clause BSD, OpenSSL, CDDL, EPL, any
# proprietary or source-available terms — must be rejected here rather than argued about
# in a pull request. `cargo deny` checks the workspace crates too, which is why
# GPL-3.0-or-later is on the list; other copyleft licenses go on it when a dependency
# actually needs them, not in advance.
[licenses]
allow = ["GPL-3.0-or-later", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "OFL-1.1"]

[advisories]
yanked = "deny"
ignore = [
  # `paste` is unmaintained (informational, not a vulnerability). It is a proc-macro
  # dependency of safer-bytes <- woff2-patched, our WOFF2 decoder (ADR 0005). Revisit
  # when woff2-patched drops it or when we switch decoders.
  "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
